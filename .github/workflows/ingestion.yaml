name: Data ingestion pipeline

on:

  schedule:
  - cron: "00 12 * * *"

  workflow_dispatch:


defaults:
  run:
    working-directory: ./fetch

jobs:
  run-data-ingestion-pipeline:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run producer
      env:
        f_hub_api: ${{ secrets.F_HUB_API }}
        kafka_bootstrap_server: ${{ secrets.KAFKA_BOOTSTRAP_SERVER }}
        sasl_username: ${{ secrets.SASL_USERNAME }}
        sasl_password: ${{ secrets.SASL_PASSWORD }}
      run: python fetch.py

  run-consumer:
    needs: run-pipeline
    uses: ./.github/workflows/s3_upload.yaml
